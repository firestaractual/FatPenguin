  <!-- ice sheet -->
  <path d="M0 78 H128 V104 Q128 128 104 128 H24 Q0 128 0 104 Z" fill="#e8f6fb"/>
  <!-- hole -->
  <ellipse cx="64" cy="84" rx="36" ry="10" fill="#08263d"/>
  <!-- cracks -->
  <g stroke="#7fb4cc" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M28 88 L14 96 L6 110"/>
    <path d="M98 88 L112 98 L120 112"/>
    <path d="M46 93 L40 108 L44 122"/>
    <path d="M82 93 L90 110"/>
  </g>
  <!-- flippers up -->
  <path d="M32 58 Q18 36 24 24 Q34 40 42 52 Z" fill="#1b1b22"/>
  <path d="M96 58 Q110 36 104 24 Q94 40 86 52 Z" fill="#1b1b22"/>
